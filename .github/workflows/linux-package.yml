name: Debian package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solarpowerhouse-debian-package
  cancel-in-progress: true

jobs:
  package:
    name: Build Debian .deb
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For a manual run, resolve the selected branch at job start so the
          # package represents its current/latest commit.
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Record built commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            dpkg-dev \
            libsqlite3-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            libqt6sql6-sqlite

      - name: Build Debian package
        run: ./deploy/build-debian-package.sh --output-dir dist

      - name: Validate Debian package
        run: |
          package=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -F '/usr/bin/solar-core'
          dpkg-deb --contents "$package" | grep -F '/usr/bin/solar-hmi'
          dpkg-deb --contents "$package" | grep -F '/usr/lib/systemd/system/solar-powerhouse.target'

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarpowerhouse-debian-${{ steps.revision.outputs.sha }}
          path: dist/*.deb
          if-no-files-found: error
