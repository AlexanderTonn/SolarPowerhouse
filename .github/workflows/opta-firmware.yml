name: Opta firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/opta-mppt-gateway/**"
      - ".github/workflows/opta-firmware.yml"
  pull_request:
    paths:
      - "firmware/opta-mppt-gateway/**"
      - ".github/workflows/opta-firmware.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Compile PlatformIO Arduino Opta gateway
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile firmware
        run: pio run -d firmware/opta-mppt-gateway -e opta

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: opta-mppt-gateway-${{ github.sha }}
          path: firmware/opta-mppt-gateway/.pio/build/opta/
          if-no-files-found: error
