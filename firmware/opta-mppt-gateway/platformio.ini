[env:opta]
platform = ststm32
board = opta
framework = arduino

monitor_speed = 115200
upload_protocol = dfu

lib_deps =
    arduino-libraries/ArduinoModbus@^1.0.8
    arduino-libraries/ArduinoRS485

; Ethernet and SPI are provided by the Arduino Mbed Opta framework.
; All gateway implementation files are maintained under src/ as .hpp/.cpp.
